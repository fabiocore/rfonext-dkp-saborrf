# Compose específico pra deploy via Dokploy — usa o Traefik do próprio
# Dokploy pra rotear os domínios (configurado em Domains, por ambiente),
# por isso o serviço "web" NÃO publica porta no host (diferente do
# docker-compose.prod.yml, pensado pra Docker Compose puro sem Dokploy).
# Traefik alcança os containers pela rede interna do Docker; ele descobre a
# porta certa (80) a partir da config de Domain de cada app no Dokploy.
#
# Cada guild = um projeto Dokploy próprio, com ambientes "dev" e "prod"
# separados (PREMISSAS.md seção 10) — este mesmo arquivo é reusado pelos
# dois, cada um com seu próprio .env/segredos definidos no Dokploy.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      GM_BOOTSTRAP_USERNAME: ${GM_BOOTSTRAP_USERNAME}
      GM_BOOTSTRAP_PASSWORD: ${GM_BOOTSTRAP_PASSWORD}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
